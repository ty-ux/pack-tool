name: Windows desktop

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Expected desktop tag v$version." }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            desktop/requirements-build.txt
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix desktop ci
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: npm --prefix desktop run package:windows
      - run: npm --prefix desktop run test:windows
      - uses: actions/upload-artifact@v7
        with:
          name: PackTool-win-x64
          path: desktop/out/PackTool-win-x64.zip
          compression-level: 0
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PackTool-win-x64
          path: release
      - name: Publish Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/PackTool-win-x64.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
